name: Docker Build

on:
  workflow_dispatch:
  push:
    branches: [ "feat/upgrade-py312-cuda12" ]
    
env:
  UBUNTU_VERSION: 22.04
  BUILDX_NO_DEFAULT_ATTESTATIONS: 1

jobs:
  nvidia-base:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        build:
          # TARGET: Latest ComfyUI | Python 3.12 | PyTorch 2.5.1 | CUDA 12.8.1
          # We leave 'comfyui' empty so the script fetches the latest tag automatically
          - {latest: "true", comfyui: "", python: "3.12", pytorch: "2.5.1", cuda: "12.8.1"}
    
    steps:
      - name: Free Space
        run: |
          df -h
          sudo rm -rf /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          sudo rm -rf /usr/local/share/boost /usr/local/lib/android
          df -h

      - name: Env Setter
        run: |
          REPO=${GITHUB_REPOSITORY,,}
          echo "REPO_NAMESPACE=${REPO%%/*}" >> ${GITHUB_ENV}
          echo "REPO_NAME=${REPO#*/}" >> ${GITHUB_ENV}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Permissions fixes
        run: |
          target="${HOME}/work/${{ env.REPO_NAME }}/${{ env.REPO_NAME }}/build/COPY*"
          chmod -R ug+rwX ${target}

      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set tags
        run: |
          img_path_ghcr="ghcr.io/${{ env.REPO_NAMESPACE }}/${{ env.REPO_NAME }}"
          img_path_dhub="${{ secrets.DOCKERHUB_USER }}/${{ env.REPO_NAME }}"
          
          # 1. Fetch Latest ComfyUI Version if not specified
          if [[ -z '${{ matrix.build.comfyui }}' ]]; then
              echo "Fetching latest ComfyUI release tag..."
              COMFYUI_BUILD_REF="$(curl -s https://api.github.com/repos/comfyanonymous/ComfyUI/tags | jq -r '.[0].name')"
          else
              COMFYUI_BUILD_REF="${{ matrix.build.comfyui }}"
          fi
          
          # Safety check
          [ -z "$COMFYUI_BUILD_REF" ] && { echo "Error: COMFYUI_BUILD_REF is empty. Exiting script." >&2; exit 1; }
          echo "COMFYUI_BUILD_REF=${COMFYUI_BUILD_REF}" >> ${GITHUB_ENV}
          echo "Using ComfyUI Version: $COMFYUI_BUILD_REF"

          # 2. Construct Base Tag (v2-cuda-12.8.1-pytorch-2.5.1-py3.12-22.04)
          base_tag="v2-cuda-${{ matrix.build.cuda }}-pytorch-${{ matrix.build.pytorch }}-py${{ matrix.build.python }}-${{ env.UBUNTU_VERSION }}"

          # 3. Construct Full Tag List
          if [[ ${{ matrix.build.latest }} == "true" ]]; then
                echo "Marking latest"
                # GHCR Tags
                TAGS="${img_path_ghcr}:${base_tag}, ${img_path_ghcr}:latest-cuda"
                # DockerHub Tags
                TAGS="${TAGS}, ${img_path_dhub}:${base_tag}, ${img_path_dhub}:latest-cuda"
            else
                TAGS="${img_path_ghcr}:${base_tag}, ${img_path_dhub}:${base_tag}"
            fi
          echo "TAGS=${TAGS}" >> ${GITHUB_ENV}

      # CRITICAL: Added Buildx to enable caching
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: build
          push: true
          provenance: false
          tags: ${{ env.TAGS }}
          build-args: |
            # CORRECTED PATTERN: 3.12-v2-cuda-12.8.1-devel-22.04
            IMAGE_BASE=ghcr.io/${{ env.REPO_NAMESPACE }}/python:${{ matrix.build.python }}-v2-cuda-${{ matrix.build.cuda }}-devel-${{ env.UBUNTU_VERSION }}
            PYTHON_VERSION=${{ matrix.build.python }}
            PYTORCH_VERSION=${{ matrix.build.pytorch }}
            COMFYUI_BUILD_REF=${{ env.COMFYUI_BUILD_REF }}
          cache-from: type=gha
          cache-to: type=gha,mode=max